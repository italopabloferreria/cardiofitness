name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$tool_dir"
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          if ! printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --status; then
            printf 'Secret scanner checksum verification failed.\n'
            exit 2
          fi
          tar -xzf "$archive" -C "$tool_dir" gitleaks

      - name: Scan all fetched history
        shell: bash
        run: |
          set -euo pipefail
          # For private local diagnostics, use Gitleaks v8.30.1 with these flags
          # and remove the output redirect. Keep redacted diagnostics private.
          status=0
          "$RUNNER_TEMP/gitleaks-8.30.1/gitleaks" git . \
            --config=.github/security/gitleaks.toml \
            --gitleaks-ignore-path=.github/security/gitleaks-reviewed-history.txt \
            --log-opts="--all --full-history" \
            --ignore-gitleaks-allow \
            --redact=100 \
            --max-decode-depth=3 \
            --max-archive-depth=3 \
            --log-level=error \
            --no-banner \
            --exit-code=1 >/dev/null 2>&1 || status=$?
          case "$status" in
            0) printf 'Secret scan passed.\n' ;;
            1) printf 'Secret scan blocked: candidate secrets detected. Diagnose locally with redaction enabled.\n'; exit 1 ;;
            *) printf 'Secret scan could not complete. Diagnose locally with redaction enabled.\n'; exit 2 ;;
          esac
